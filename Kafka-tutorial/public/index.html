<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location sharing application</title>
  </head>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    #map {
      height: 90vh;
    }
  </style>
  <body>
    <h1>Hello</h1>

    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();

      const map = L.map("map").setView([51.505, -0.09], 13);

      const remoteMarker = new Map()

      socket.on("server:location:update", (data)=>{
        const {id, latitude, longitude} = data

        if(!remoteMarker.has(id)){
            const marker = L.marker([latitude, longitude]).addTo(map).bindPopup(id)
            remoteMarker.set(id, marker)
        }
        else{
            const existingMarker = remoteMarker.get(id)
            existingMarker.setLatLng([latitude, longitude])
        }

      })

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function getUserLocation() {
        return new Promise((resolve, reject) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                console.log(position);

                const { latitude, longitude } = position.coords;

                resolve({ latitude, longitude });
              },
              (error) => {
                console.log(error);
                reject(error);
              },
              {
                enableHighAccuracy: true,
              },
            );
          } else {
            console.log("Geolocation is not available in your browser");
          }
        });
      }

      const myCurrentLocationMarker = null;

      async function main() {
        setInterval(async () => {
          const { latitude, longitude } = await getUserLocation();

          socket.emit("client:location:update", { longitude, latitude });
          if (!myCurrentLocationMarker) {
            L.marker([latitude, longitude])
              .addTo(map)
              .bindPopup("You are here")
              .openPopup();
          } else {
            myCurrentLocationMarker.setLatLng([latitude, longitude]);
          }
        }, 10000);
      }

      window.addEventListener("load", () => main());
    </script>
  </body>
</html>
